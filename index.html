<!DOCTYPE html>
<html lang="en">
<head>
       <meta charset="UTF-8">
       <meta name="viewport" content="width=device-width, initial-scale=1.0">
       <title>Parallax Curtain Gallery</title>
       <link rel="stylesheet" href="stylesheet/out.css">
</head>
<body>
       <header class="header">
              <div class="wordWrapper ">
                     <span class="header-text h-10 flex w-fit items-center make-text duration-900 text-white">Parallax Curtain Gallery</span>
                     <div class="header-text *:flex *:items-center w-25 h-10 flex items-center  " id="changingWord">
                          <span class="words absolute  text-white  w-full h-full top-0 left-0 ">01</span>  
                          <span class="words absolute text-white  w-full h-full top-0  left-0">02</span>  
                          <span class="words absolute  text-white  w-full h-full top-0  left-0">03</span>  
                          <span class="words absolute  text-white  w-full h-full top-0 left-0">04</span>  
                          <span class="words absolute  text-white  w-full h-full top-0 left-0">05</span>  
                          <span class="words absolute  text-white  w-full h-full top-0 left-0">06</span> 
                     </div>
              </div>
              <nav class="hidden sm:flex w-2/3 h-full ">
                     <ul class="w-full flex items-center gap-1.25  justify-end h-full *:font-normalInter ">
                            <li class="navItems" data-index="0">
                                   <a href="">Tools</a>
                            </li>
                            <li class="navItems" data-index="1">
                                   <a href="">Service</a>
                            </li>
                            <li class="navItems" data-index="2">
                                   <a href="">FAQ</a>
                            </li>
                            <li class="navItems" data-index="3">
                                   <a href="">Contact</a>
                            </li>
                     </ul>
              </nav>
       </header>
       <main class="main-wrapper ">
              <section class="sec pin" id="sec1" data-bg="#A31622">
                   <figure class="photo">
                     <img src="images/newyork.avif" alt="newyork" > 
                   </figure>  
              </section>

              <section class="sec pin" id="sec2" data-bg="#FCF7F8">
                    <figure class="photo">
                     <img  src="images/chicago.avif" alt="chicago">
                   </figure> 
              </section>

              <section class="sec pin" id="sec3" data-bg="#CED3DC">
                     <figure class="photo">
                      <img src="images/losangeles.avif" alt="LosAngeles"> 
                   </figure> 
              </section>

              <section class="sec pin" id="sec4" data-bg="#343434">
                   <figure class="photo">
                     <img src="images/florida.avif" alt="florida">
                   </figure> 
              </section> 

               <section class="sec pin" id="sec4" data-bg="#342414">
                   <figure class="photo">
                     <img src="images/texas.avif" alt="texas">
                   </figure> 
              </section> 

              <section class="sec pin" id="sec4" data-bg="#342414">
                   <figure class="photo">
                     <img src="images/nevada.avif" alt="laswages">
                   </figure> 
              </section> 

              <div class="line"></div>
              <div class="row *:font-boldInter overflow-hidden">
                     
                     <div class="middleTextBox">
                     <h1>New York</h1>
                     <h4>by Emma Gasseau-Dryer</h4>
                     <!-- <p>Taken in New York from the top of the empire state building in 2024.</p> -->
                     </div>

                     <div class="middleTextBox">
                            <h1>Chicago</h1>
                            <h4>by Lance Anderson</h4>
                     </div>
                     
                     
                     <div class="middleTextBox">
                            <h1>Los Angeles</h1>
                     <h4>by Cedric Letsch</h4>
                     <!-- <p>Los Angeles skyline at sunset.</p> -->
                     
                     </div>

                     <div class="middleTextBox">
                            <h1>florida</h1> 
                     <h4>by Denys Kostyuchenko</h4>
                     <!-- <p>Miami Beach, Florida, EE. UU.</p> -->
                     
                     </div>
                     
                     <div class="middleTextBox">
                     <h1>Texas</h1> 
                     <h4>by MJ Tangonan</h4>
                     <!-- <p>Texas Theater in San Angelo, TX</p> -->
                     
                     </div>
                     
                     <div class="middleTextBox">
                     <h1>Las Vegas</h1> 
                     <h4>by Yves Scheuber</h4>
                     <!-- <p>Las Vegas strip and famous Bellagio fountain show.</p> -->
                     
                     </div>
                     
              </div>
              <div class="sideText font-lightInter left-5 lg:left-10">scroll down</div>
              <div class="sideText font-lightInter right-5 lg:right-10">scroll down</div>
       </main>
</body>
<script src="js/script.js"></script>
</html>
